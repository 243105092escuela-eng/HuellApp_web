<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refugios · HuellApp</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
  <link rel="stylesheet" href="../../assets/css/base/reset.css">
  <link rel="stylesheet" href="../../assets/css/base/variables.css">
  <link rel="stylesheet" href="../../assets/css/base/tipografia.css">
  <link rel="stylesheet" href="../../assets/css/base/layout.css">
  <link rel="stylesheet" href="../../assets/css/components/navbar.css">
  <link rel="stylesheet" href="../../assets/css/components/botones.css">
  <link rel="stylesheet" href="../../assets/css/components/tarjetas.css">
  <link rel="stylesheet" href="../../assets/css/components/formularios.css">
  <link rel="stylesheet" href="../../assets/css/components/modal.css">
  <link rel="stylesheet" href="../../assets/css/components/tabla.css">
  <link rel="stylesheet" href="../../assets/css/pages/admin.css">
  <script type="module" src="../../assets/js/modules/admin/refugios.js"></script>
</head>
<body class="pagina-admin" data-protegida>
  <header class="encabezado" id="encabezado"></header>
  <main class="contenido">
    <h1 class="titulo-banner">Refugios</h1>
    <section aria-labelledby="titulo-resumen">
      <h2 id="titulo-resumen" class="solo-lector">Resumen de refugios</h2>
      <div class="resumen">
        <article class="dato-resumen tarjeta"><span class="dato-resumen__numero" data-resumen="pendientes">–</span><span class="dato-resumen__etiqueta">Pendientes</span></article>
        <article class="dato-resumen tarjeta"><span class="dato-resumen__numero" data-resumen="aprobados">–</span><span class="dato-resumen__etiqueta">Aprobados</span></article>
        <article class="dato-resumen tarjeta"><span class="dato-resumen__numero" data-resumen="rechazados">–</span><span class="dato-resumen__etiqueta">Rechazados</span></article>
        <article class="dato-resumen tarjeta"><span class="dato-resumen__numero" data-resumen="suspendidos">–</span><span class="dato-resumen__etiqueta">Suspendidos</span></article>
      </div>
    </section>

    <form class="herramientas" role="search">
      <div class="campo">
        <label class="campo__etiqueta" for="filtro-texto">Buscar</label>
        <input id="filtro-texto" class="campo__control" type="search" placeholder="Nombre, responsable o correo" autocomplete="off">
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="filtro-estado">Estado</label>
        <select id="filtro-estado" class="campo__control">
          <option value="aprobado" selected>Verificados</option>
          <option value="suspendido">Suspendidos</option>
          <option value="rechazado">Rechazados</option>
          <option value="pendiente">Pendientes</option>
          <option value="">Todos</option>
        </select>
      </div>
    </form>

    <p id="conteo" class="texto-suave" role="status" aria-live="polite"></p>
    <p id="anuncio" class="solo-lector" role="status" aria-live="polite"></p>

    <div id="contenedor-tabla" class="tabla-contenedor" role="region" aria-label="Refugios (se puede desplazar horizontalmente)" tabindex="0" hidden>
      <table class="tabla">
        <caption class="solo-lector">Refugios registrados en HuellApp</caption>
        <thead>
          <tr>
            <th scope="col">Refugio</th><th scope="col">Responsable</th><th scope="col">Correo</th><th scope="col">Teléfono</th>
            <th scope="col">Registro</th><th scope="col">Estado</th><th scope="col"><span class="solo-lector">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>
    <p id="sin-resultados" class="vacio" hidden>Ningún refugio coincide con esos filtros.</p>

    <dialog id="modal-accion" class="modal" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo" class="modal__titulo">Suspender refugio</h2>
      <p id="modal-texto"></p>
      <div class="campo" id="campo-motivo-suspension">
        <label class="campo__etiqueta" for="motivo-suspension">Motivo (opcional)</label>
        <textarea id="motivo-suspension" class="campo__control" maxlength="400" placeholder="El refugio verá este mensaje en su pantalla de estado."></textarea>
      </div>
      <div id="alerta-modal" role="alert" hidden></div>
      <div class="modal__acciones">
        <button id="cancelar-accion" class="boton boton--contorno" type="button">Cancelar</button>
        <button id="confirmar-accion" class="boton boton--peligro" type="button">Sí, suspender</button>
      </div>
    </dialog>
  </main>
</body>
</html>
