<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estado de tu refugio · HuellApp</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
  <link rel="stylesheet" href="../assets/css/base/reset.css">
  <link rel="stylesheet" href="../assets/css/base/variables.css">
  <link rel="stylesheet" href="../assets/css/base/tipografia.css">
  <link rel="stylesheet" href="../assets/css/components/navbar.css">
  <link rel="stylesheet" href="../assets/css/components/botones.css">
  <link rel="stylesheet" href="../assets/css/components/tarjetas.css">
  <link rel="stylesheet" href="../assets/css/pages/login.css">
  <script type="module" src="../assets/js/modules/auth/estado-refugio.js"></script>
</head>
<body data-protegida>
  <header class="encabezado">
    <div class="encabezado__interno">
      <span class="marca">
        <span class="logo-texto marca__texto">HuellApp</span>
        <img class="marca__huella" src="../assets/img/logos/huella.svg" alt="" width="48" height="48">
      </span>
    </div>
  </header>
  <main class="estado">
    <p id="estado-refugio-nombre" class="texto-suave"></p>
    <h1 id="estado-titulo"></h1>
    <span id="estado-insignia" class="insignia"></span>
    <section class="tarjeta">
      <p id="estado-texto" class="tarjeta__cuerpo"></p>
    </section>
    <p id="estado-apelacion" class="texto-suave texto-pequeno" hidden></p>
    <div class="estado__acciones">
      <button class="boton boton--primario" id="boton-apelar" type="button" hidden>Solicitar apelación</button>
      <button class="boton boton--secundario" id="boton-actualizar" type="button">Actualizar estado</button>
      <button class="boton boton--contorno" id="boton-salir" type="button">Cerrar sesión</button>
    </div>
  </main>
</body>
</html>
